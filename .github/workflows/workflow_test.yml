name: Build ARM .deb Packages test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (e.g., debug or release)'
        required: false
        default: 'release'
      target_arch:
        description: 'Target architecture (e.g., arm/v7, arm64, amd64)'
        required: false
        default: 'arm/v7'

jobs:
  build-arm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: machinekit-hal-last-update
          fetch-depth: 0  # Improves cache efficiency for R1 model

      - name: Configure QEMU for R1 architecture
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ contains(github.event.inputs.target_arch, 'arm') && 'arm' || 'amd64' }}

      - name: Initialize Buildx with enhanced caching
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ github.event.inputs.target_arch || 'arm/v7' }}
          install: true
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Optimized cache handling
        run: |
          mkdir -p /tmp/.buildx-cache
          [ -f /tmp/.buildx-cache/index.json ] || echo '{}' > /tmp/.buildx-cache/index.json

      - name: Smart architecture mapping
        id: arch-map
        run: |
          case "${{ github.event.inputs.target_arch || 'arm/v7' }}" in
            "arm/v7")   echo "base_image=arm32v7/debian:bullseye" >> $GITHUB_OUTPUT ;;
            "arm64")    echo "base_image=arm64v8/debian:bullseye" >> $GITHUB_OUTPUT ;;
            "amd64")    echo "base_image=debian:bullseye" >> $GITHUB_OUTPUT ;;
            *)          echo "base_image=debian:bullseye" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build Docker image with R1 optimizations
        run: |
          docker buildx build \
            --platform linux/${{ github.event.inputs.target_arch || 'arm/v7' }} \
            --file Docker/bullseye/dockerfile \
            --build-arg BASE_IMAGE=${{ steps.arch-map.outputs.base_image }} \
            --tag emc-app:${{ github.event.inputs.build_type || 'release' }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load \
            --progress plain \
            .

      # Rest of your original steps remain unchanged...
