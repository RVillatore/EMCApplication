name: Build ARMv7 .deb Packages

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: false
        default: 'debug'

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: machinekit-hal-last-update

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm/v7

      - name: Initialize cache with valid manifest
        run: |
          mkdir -p /tmp/.buildx-cache
          # Create properly formatted JSON with valid timestamp
          if [ ! -f /tmp/.buildx-cache/index.json ]; then
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            echo '{"v":"0","created":"'"${TIMESTAMP}"'","tags":["latest"]}' > /tmp/.buildx-cache/index.json
          fi

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            --file Docker/bullseye/dockerfile \
            --build-arg BASE_IMAGE=arm32v7/debian:bullseye \
            --tag emc-app:${{ inputs.build_type || 'release' }} \
            --cache-from type=local,src=/tmp/.buildx-cache,tag=latest \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,tag=latest,mode=max,compression=zstd \
            --load \
            --progress plain \
            .

      - name: Rotate and validate cache
        run: |
          # Remove old cache
          rm -rf /tmp/.buildx-cache/*
          
          # Move new cache and ensure manifest exists
          mkdir -p /tmp/.buildx-cache
          [ -d /tmp/.buildx-cache-new ] && mv /tmp/.buildx-cache-new/* /tmp/.buildx-cache/ || true
          
          # Recreate manifest if missing
          if [ ! -f /tmp/.buildx-cache/index.json ]; then
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            echo '{"v":"0","created":"'"${TIMESTAMP}"'","tags":["latest"]}' > /tmp/.buildx-cache/index.json
          fi

      - name: Execute package build
        run: |
          docker run --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/machinekit/emca \
            --workdir /machinekit/emca \
            --name temp-container \
            emc-app:${{ inputs.build_type || 'release' }} \
            /bin/bash scripts/BuildPKG.sh

      - name: Extract artifacts
        run: |
          docker cp temp-container:/machinekit/emca ./
          docker rm temp-container

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: emc-${{ inputs.build_type || 'release' }}-armv7-debs
          path: ./emca/*.deb
