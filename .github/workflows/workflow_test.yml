name: Build ARM .deb Packages

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: false
        default: 'debug'
      target_arch:
        description: 'Target architecture (arm/v7, arm64, amd64)'
        required: false
        default: 'arm/v7'

jobs:
  build-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target_arch: arm/v7
            base_image: arm32v7/debian:bullseye
            qemu_arch: arm
            qemu_variant: v7
          - target_arch: arm64
            base_image: arm64v8/debian:bullseye
            qemu_arch: aarch64
            qemu_variant: ""
          - target_arch: amd64
            base_image: debian:bullseye
            qemu_arch: x86_64
            qemu_variant: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: machinekit-hal-last-update

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.qemu_arch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/${{ matrix.target_arch }}

      - name: Initialize cache
        run: |
          mkdir -p /tmp/.buildx-cache
          if [ ! -f /tmp/.buildx-cache/index.json ]; then
            echo '{"v":"0","created":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")","tags":["latest"]}' > /tmp/.buildx-cache/index.json
          fi

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/${{ matrix.target_arch }} \
            --file Docker/bullseye/dockerfile \
            --build-arg BASE_IMAGE=${{ matrix.base_image }} \
            --build-arg TARGETARCH=${{ matrix.qemu_arch }} \
            --build-arg TARGETVARIANT=${{ matrix.qemu_variant }} \
            --tag emc-app:${{ inputs.build_type || 'release' }} \
            --cache-from type=local,src=/tmp/.buildx-cache,tag=latest \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,tag=latest,mode=max \
            --load \
            --progress plain \
            .

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Execute package build
        run: |
          docker run --platform linux/${{ matrix.target_arch }} \
            -v ${{ github.workspace }}:/machinekit/emca \
            --workdir /machinekit/emca \
            --name temp-container \
            emc-app:${{ inputs.build_type || 'release' }} \
            /bin/bash scripts/BuildPKG.sh

      - name: Extract artifacts
        run: |
          docker cp temp-container:/machinekit/emca ./
          docker rm temp-container

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: emc-${{ inputs.build_type || 'release' }}-${{ matrix.target_arch }}-debs
          path: ./emca/*.deb
