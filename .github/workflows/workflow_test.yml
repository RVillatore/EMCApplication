name: Build ARMv7 .deb Packages

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: false
        default: 'debug'

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: machinekit-hal-last-update

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/arm/v7
          install: true
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Initialize cache properly
        run: |
          mkdir -p /tmp/.buildx-cache
          # Create valid cache manifest with explicit tag
          if [ ! -f /tmp/.buildx-cache/index.json ]; then
            printf '{"v":"0","created":"%s","tags":["latest"]}\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > /tmp/.buildx-cache/index.json
          fi

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            --file Docker/bullseye/dockerfile \
            --build-arg BASE_IMAGE=arm32v7/debian:bullseye \
            --tag emc-app:${{ inputs.build_type || 'release' }} \
            --cache-from type=local,src=/tmp/.buildx-cache,tag=latest \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,tag=latest,mode=max \
            --load \
            --progress plain \
            .

      - name: Finalize cache
        run: |
          # Remove old cache completely
          rm -rf /tmp/.buildx-cache
          
          # Create new cache directory structure
          mkdir -p /tmp/.buildx-cache
          
          # Copy new cache contents (including hidden files)
          [ -d /tmp/.buildx-cache-new ] && rsync -a /tmp/.buildx-cache-new/ /tmp/.buildx-cache/ || true
          
          # Ensure valid manifest exists
          printf '{"v":"0","created":"%s","tags":["latest"]}\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > /tmp/.buildx-cache/index.json

      - name: Execute package build
        run: |
          docker run --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/machinekit/emca \
            --workdir /machinekit/emca \
            --name temp-container \
            emc-app:${{ inputs.build_type || 'release' }} \
            /bin/bash scripts/BuildPKG.sh

      - name: Extract artifacts
        run: |
          docker cp temp-container:/machinekit/emca ./
          docker rm temp-container

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: emc-${{ inputs.build_type || 'release' }}-armv7-debs
          path: ./emca/*.deb
