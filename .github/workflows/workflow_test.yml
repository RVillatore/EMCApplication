name: Build ARM .deb Packages test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (e.g., debug or release)'
        required: false
        default: 'release'
      target_arch:
        description: 'Target architecture (e.g., arm/v7, arm64, amd64)'
        required: false
        default: 'arm/v7'

jobs:
  build-arm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: machinekit-hal-last-update

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ github.event.inputs.target_arch || 'arm' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ github.event.inputs.target_arch || 'arm/v7' }}

      - name: Print selected inputs
        run: |
          echo "Build type: ${{ github.event.inputs.build_type || 'release' }}"
          echo "Target architecture: linux/${{ github.event.inputs.target_arch || 'arm/v7' }}"

      - name: Initialize cache directory
        run: |
          mkdir -p /tmp/.buildx-cache
          # Create valid cache manifest if missing
          if [ ! -f /tmp/.buildx-cache/index.json ]; then
            echo '{"v":"0","created":"$(date -u +"%Y-%m-%dT%H:%M:%SZ")","tags":["latest"]}' > /tmp/.buildx-cache/index.json
          fi

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Determine base image
        id: arch-map
        run: |
          case "${{ github.event.inputs.target_arch || 'arm/v7' }}" in
            "arm/v7")   echo "base_image=arm32v7/debian:bullseye" >> $GITHUB_OUTPUT ;;
            "arm64")    echo "base_image=arm64v8/debian:bullseye" >> $GITHUB_OUTPUT ;;
            "amd64")    echo "base_image=debian:bullseye" >> $GITHUB_OUTPUT ;;
            *)          echo "base_image=debian:bullseye" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/${{ github.event.inputs.target_arch || 'arm/v7' }} \
            --file Docker/bullseye/dockerfile \
            --build-arg BASE_IMAGE=${{ steps.arch-map.outputs.base_image }} \
            --tag emc-app:${{ github.event.inputs.build_type || 'release' }} \
            --cache-from type=local,src=/tmp/.buildx-cache,tag=latest \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,tag=latest,mode=max \
            --load \
            --progress plain \
            .

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Create output directory
        run: mkdir -p output

      - name: Execute package build
        run: |
          docker run --platform linux/${{ github.event.inputs.target_arch || 'arm/v7' }} \
            -v ${{ github.workspace }}:/machinekit/emca \
            --workdir /machinekit/emca \
            --name temp-container \
            emc-app:${{ github.event.inputs.build_type || 'release' }} \
            /bin/bash scripts/BuildPKG.sh

      - name: Extract built packages
        run: |
          docker cp temp-container:/machinekit/emca ./
          docker rm temp-container

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emc-${{ github.event.inputs.build_type || 'release' }}-debs
          path: ./emca/*.deb
