name: Build ARM .deb Packages test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (e.g., debug or release)'
        required: false
        default: 'release'
      target_arch:
        description: 'Target architecture (e.g., arm/v7, arm64, amd64)'
        required: false
        default: 'arm/v7'

jobs:
  build-arm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: machinekit-hal-last-update

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ github.event.inputs.target_arch || 'arm' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Print selected inputs
        run: |
          echo "Build type: ${{ github.event.inputs.build_type || 'release' }}"
          echo "Target architecture: linux/${{ github.event.inputs.target_arch || 'arm/v7' }}"

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/${{ github.event.inputs.target_arch || 'arm/v7' }} \
            --file Docker/bullseye/dockerfile \
            --tag emc-app:${{ github.event.inputs.build_type || 'release' }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            --load .

      - name: Move cache for next build
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Create output directory
        run: mkdir -p output

      - name: List files in the workspace
        run: ls -R /github/workspace

      - name: Run container and copy .deb files from the repo root
        run: |
          # Create a container from the built image
          docker create --name temp-container emc-app:${{ github.event.inputs.build_type || 'release' }} \
            /bin/bash 
          #-c "cd /github/workspace && ./BuildPKG.sh"

          docker start temp-container
          docker exec -u machinekit temp-container -c "curl -1sLf 'https://dl.cloudsmith.io/public/machinekit/machinekit/cfg/setup/bash.deb.sh' | sudo -E bash"
          docker exec -u machinekit temp-container -c "curl -1sLf 'https://dl.cloudsmith.io/public/machinekit/machinekit-hal/cfg/setup/bash.deb.sh'' | sudo -E bash"

          # 1. Change directory
          docker exec -u machinekit test-container bash -c "cd /github/workspace/"

          docker exec -u machinekit test-container bash -c "cd /github/workspace/ && export PKG_CONFIG_PATH=/github/workspace/"

          docker exec -u machinekit test-container bash -c "cd /github/workspace/ && sudo update-alternatives --set fakeroot /usr/bin/fakeroot-tcp"
          
          docker exec -u machinekit test-container bash -c "cd /github/workspace/ && ./debian/configure machinekit-hal=0.5.21099-1.git2c2ff0e51~bullseye no-docs"
          
          docker exec -u machinekit test-container bash -c "cd /github/workspace/ && mk-build-deps --remove --root-cmd sudo --tool 'apt-cudf-get --solver aspcud -o APT::Get::Assume-Yes=1 -o Debug::pkgProblemResolver=0 -o APT::Install-Recommends=0' debian/control"

          docker exec -u machinekit test-container bash -c "cd /github/workspace/ && sudo apt install ./*.deb -y"
          
          # 4. Build the package
          docker exec -u machinekit test-container bash -c "cd /github/workspace/ && dpkg-buildpackage -us -uc"

          docker exec -u machinekit test-container bash -c "cd /github/workspace/ && cp ../*.deb ."
          
          # Copy all .deb files from the root folder inside the container
          docker cp temp-container:/github/workspace/*.deb ./output

          # Remove the container to ensure a clean state next time
          docker rm temp-container

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emc-${{ github.event.inputs.build_type || 'release' }}-debs
          path: ./output/**/*.deb
