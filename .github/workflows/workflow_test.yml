name: Build ARM .deb Packages test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (e.g., debug or release)'
        required: false
        default: 'release'
      target_arch:
        description: 'Target architecture (e.g., arm/v7, arm64, amd64)'
        required: false
        default: 'arm/v7'

jobs:
  build-arm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: machinekit-hal-last-update

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ github.event.inputs.target_arch || 'arm' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ github.event.inputs.target_arch || 'arm/v7' }}

      - name: Print selected inputs
        run: |
          echo "Build type: ${{ github.event.inputs.build_type || 'release' }}"
          echo "Target architecture: linux/${{ github.event.inputs.target_arch || 'arm/v7' }}"

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/${{ github.event.inputs.target_arch || 'arm/v7' }} \
            --file Docker/bullseye/dockerfile \
            --tag emc-app:${{ github.event.inputs.build_type || 'release' }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            --load .

      - name: Move cache for next build
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Create output directory
        run: mkdir -p output

      - name: Create container and copy source
        run: |
          docker create --name temp-container --platform linux/${{ github.event.inputs.target_arch || 'arm/v7' }} emc-app:${{ github.event.inputs.build_type || 'release' }} /bin/bash
          docker start temp-container

          # Copy the entire repo to /machinekit/emca inside the container
          docker exec temp-container mkdir -p /machinekit/emca
          docker cp . temp-container:/machinekit/emca

      - name: Run build inside container
        run: |
          docker start temp-container
          docker exec -u machinekit temp-container bash -c "curl -1sLf 'https://dl.cloudsmith.io/public/machinekit/machinekit/cfg/setup/bash.deb.sh' | sudo -E bash"
          docker exec -u machinekit temp-container bash -c "curl -1sLf 'https://dl.cloudsmith.io/public/machinekit/machinekit-hal/cfg/setup/bash.deb.sh' | sudo -E bash"

          docker exec -u machinekit temp-container bash -c "cd /machinekit/emca && ./debian/configure machinekit-hal=0.5.21099-1.git2c2ff0e51~bullseye no-docs"
          docker exec -u machinekit temp-container bash -c "cd /machinekit/emca && mk-build-deps --remove --root-cmd sudo --tool 'apt-cudf-get --solver aspcud -o APT::Get::Assume-Yes=1 -o Debug::pkgProblemResolver=0 -o APT::Install-Recommends=0' debian/control"
          docker exec -u machinekit temp-container bash -c "cd /machinekit/emca && sudo apt install ./*.deb -y"
          docker exec -u machinekit temp-container bash -c "cd /machinekit/emca && dpkg-buildpackage -us -uc"
          docker exec -u machinekit temp-container bash -c "cd /machinekit && cp *.deb /machinekit/emca || true"

      - name: Copy built .deb files
        run: |
          docker cp temp-container:/machinekit/emca ./
          docker rm temp-container

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emc-${{ github.event.inputs.build_type || 'release' }}-debs
          path: ./emca/*.deb
