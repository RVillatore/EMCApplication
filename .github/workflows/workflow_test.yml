name: Build ARM .deb Packages test

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (e.g., debug or release)'
        required: false
        default: 'release'
      target_arch:
        description: 'Target architecture (e.g., arm/v7, arm64, amd64)'
        required: false
        default: 'arm/v7'

jobs:
  build-arm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: machinekit-hal-last-update

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ github.event.inputs.target_arch || 'arm' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ github.event.inputs.target_arch || 'arm/v7' }}

      - name: Print selected inputs
        run: |
          echo "Build type: ${{ github.event.inputs.build_type || 'release' }}"
          echo "Target architecture: linux/${{ github.event.inputs.target_arch || 'arm/v7' }}"

      - name: Ensure buildx cache directory exists
        run: mkdir -p /tmp/.buildx-cache
  
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/${{ github.event.inputs.target_arch || 'arm/v7' }} \
            --file Docker/bullseye/dockerfile \
            --tag emc-app:${{ github.event.inputs.build_type || 'release' }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new \
            --load .

      - name: Move cache for next build
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Create output directory
        run: mkdir -p output

      - name: Create container and copy source
        run: |
          #docker create --name temp-container --platform linux/${{ github.event.inputs.target_arch || 'arm/v7' }} emc-app:${{ github.event.inputs.build_type || 'release' }} /bin/bash
          #docker start temp-container
          #docker run --rm --platform linux/arm/v7 emc-app:${{ github.event.inputs.build_type || 'release' }} tail -f /dev/null
          docker run --platform linux/${{ github.event.inputs.target_arch || 'arm/v7' }} \
            -v ${{ github.workspace }}:/machinekit/emca \
            --workdir /machinekit/emca \
            --name temp-container \
            emc-app:${{ github.event.inputs.build_type || 'release' }} \
            /bin/bash scripts/BuildPKG.sh

      - name: Copy built .deb files
        run: |
          docker cp temp-container:/machinekit/emca ./
          docker rm temp-container

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: emc-${{ github.event.inputs.build_type || 'release' }}-debs
          path: ./emca/*.deb
