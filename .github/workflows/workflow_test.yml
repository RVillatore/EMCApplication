name: Build ARMv7 .deb Packages

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: false
        default: 'release'

jobs:
  build-armv7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: machinekit-hal-last-update

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker buildx build \
            --platform linux/arm/v7 \
            --file Docker/bullseye/dockerfile \
            --build-arg BASE_IMAGE=arm32v7/debian:bullseye \
            --tag emc-app:${{ github.event.inputs.build_type || 'release' }} \
            --load \
            --progress plain \
            .

      - name: Execute package build
        run: |
          docker run --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/machinekit/emca \
            -e HOME=/machinekit \
            --workdir /machinekit/emca \
            --name temp-container \
            emc-app:${{ github.event.inputs.build_type || 'release' }} \
            /bin/bash /machinekit/emca/BuildPKG.sh

      - name: Extract artifacts
        run: |
          docker cp temp-container:/machinekit/emca ./
          docker rm temp-container

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: emc-${{ github.event.inputs.build_type || 'release' }}-armv7-debs
          path: ./emca/*.deb
